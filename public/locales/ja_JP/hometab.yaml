CommunityCard:
  Discord:
    Title: Discord
    Description: 何千人ものプレイヤーとビルド、戦略、最適化のヒントを共有しましょう。
  Github:
    Title: GitHub
    Description: プロジェクトへの貢献はここでできます。バグ報告、機能提案、プルリクエストを歓迎します。
