    Title: ロードマップ
    Description: プロジェクトボードで計画中および進行中のタスクを確認できます。
  Changelog:
    Title: 更新履歴
    Description: 最新のアップデート、新機能、バグ修正を確認できます。
FeatureCard:
  Showcase:
    Title: キャラクターのショーケース
    Description: キャラクターのステータスをショーケースしたり、未所持のキャラクターをあらかじめビルドしたりできます。DPS スコアで戦闘ダメージをシミュレーションし、他のビルドと比較して評価しましょう。
    Features:
      - DPS スコアとステータス分析による詳細なステータス表示
      - 正確なスコア計算のためのチームメイトのバフ設定
      - 今持っている遺物で未実装キャラクターのステータスをシミュレーション
  Optimizer:
    Title: 最適化エンジン
    Description: キャラクターを最適化して、目標値に到達し、ステータスを最大化するための最適な遺物の組み合わせを見つけましょう。
    Features:
      - ステータス、スキル、またはスキル回しのダメージに対する最適なビルドを検索
      - 毎秒数十億ものビルドを処理する GPU アクセラレーション計算
      - ダメージ計算のためのチームメイトの条件付きバフを設定
  Warp:
    Title: 跳躍計画
    Description: 天井カウント、還元、および将来の獲得リソースの予測をもとに、キャラクターや光円錐の跳躍の成功確率を性格に計算します。
    Features:
      - 目標到達に必要な平均跳躍回数の期待値を表示
      - 無課金および各課金層向けのバージョン毎の星玉収入トラッキング
      - 重複交換による星芒還元の計算
  DamageCalculator:
    Title: ダメージ計算
    Description: チーム編成、バフ条件、スキル回しを完全にカスタマイズして、与ダメージを正確に計算し、ダメージを最大限引き出しましょう。
    Features:
      - ローテーション、チームメイト、遺物をカスタマイズ
      - バフの発生源とスキルごとの内訳を確認
      - 使いやすいプリセットですぐに開始可能
  Benchmarks:
    Title: ビルドベンチマーク
    Description: どの遺物セットとメインステータスがキャラクターにとって最大のダメージを出すかを確認できます。各設定に対して最適なサブステータスの配分を見つけましょう。
    Features:
      - メインステータスと遺物の組み合わせを直接比較
      - '2つの基準：現実的なベンチマークと理想的なビルド'
      - 展開してステータス、強化の伸び、ダメージの内訳を表示
  RarityAnalysis:
    Title: レア度分析
    Description: キャラクターごとのサブステータスの重み付けを使用して遺物のクオリティを評価し、理論上の最大値に対して各遺物をランク付けします。
    Features:
      - 遺物の置き換えに必要な周回日数を推定
      - サブステータスの高い・中くらい・低い伸びを視覚化
      - 各遺物の強化ポテンシャルを確認
