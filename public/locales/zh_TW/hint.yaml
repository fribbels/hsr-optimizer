RatingFilter:
  Title: 評分過濾器
  p1: >-
    有效生命值 - 用於衡量滿級角色的生存能力。透過生命值、防禦力和減傷被動計算
  p2: >-
    普攻 / 戰技 / 終結技 / 追加攻擊 / 持續傷害 / 擊破攻擊（弱點擊破） - 技能傷害計算，基於角色被動 / 光錐被動 / 敵方選項等環境因素。
  p3: >-
    治療/護盾 - 其他能力計算，基於角色被動 / 光錐被動 / 敵方選項等環境因素。
CombatBuffs:
  Title: 戰鬥增益
  p1: 額外的團隊增益將應用於計算。請注意，角色 / 光錐的自我增益、被動和行跡的增益已包含在計算中。
ComboFilters:
  Title: 連招循環
  p1: 定義技能循環以衡量連招傷害。循環以 [ 為回合開始，] 為回合結束。有關更多詳細資訊，請參閱高級循環選單和使用者指南。
  p2: '「預設」選項允許你在需要時停用預處理器。'
StatFilters:
  Title: 屬性過濾器
  p1: 角色屬性的最小（左邊）/ 最大（右邊）值過濾器（最小和最大值包括在內）。優化器將僅顯示在這些範圍內的結果。
  p2: 屬性縮寫為攻擊 / 生命 / 防禦 / 速度 / 爆擊率 / 爆擊傷害 / 效果命中 / 效果抵抗 / 擊破特攻 / 能量恢復
  p3: "注意：遊戲中的速度小數點會被截斷（四捨五入），因此你可能會看到遊戲中的速度值高於此處顯示的值。這是因為OCR導入器無法偵測隱藏的小數點。"
Mainstats:
  Title: 主屬性
  p1: 選擇用於優化器搜尋的主要屬性。可以選擇多個主屬性以取得更多選項。
Sets:
  Title: 套裝
  p1: 選擇要用於過濾結果的隧道遺器和位面飾品套裝。可以選擇多個套裝以獲取更多選項。
  p2: 套裝效果將在計算中被考慮，請使用"套裝條件觸發效果"選單來自訂哪些效果是啟動的。
Character:
  Title: 角色
  p1: 選擇角色和星魂數。角色在優化計算中會被預設為80級和滿行跡。
CharacterPassives:
  Title: 角色被動
  p1: 選擇要套用於角色的條件觸發效果。
  p2: 依賴戰鬥屬性或環境狀態的效果將預設套用，因此此處僅列出需要使用者輸入的選項。
LightconePassives:
  Title: 光錐被動
  p1: 選擇要應用於光錐的條件觸發效果。
  p2: 依賴戰鬥屬性或環境狀態的效果將預設套用，因此此處僅列出需要使用者輸入的選項。
Lightcone:
  Title: 光錐
  p1: 選擇光錐和疊影數。光錐在優化計算中會被預設為80級。
  p2: 被動效果在光錐被動面板下應用。
Actions:
  Title: 可執行動作
  p1: 裝備 - 將表格中選取的遺器裝備到角色上。
  p2: 過濾 - 在現有結果上重新套用搜尋篩選器。使用此功能可以在不重新啟動搜尋的情況下縮小過濾範圍。
  p3: 置頂配裝 - 將目前選取的行固定在表格頂部。使用此功能可以更輕鬆地比較多個配裝。
  p4: 清除所有置頂 - 清除所有置頂在表格頂部的配裝。
Builds:
  Title: 配裝
  p1: 儲存 – 儲存目前選中的配裝及全部優化器設定
  p2: 載入 – 將已儲存的配裝載入至優化器。包含隊友設定、條件選項與連招設定。
OptimizerOptions:
  Title: 優化器選項
  PriorityFilter: >-
    <0>角色優先級篩選器</0> - 啟用此選項後，角色只能從低於該角色優先權的其他角色拿取遺器。優化器將忽略清單中優先順序高於目前角色的遺器裝備者。你可以在優先選擇器中更改角色排名，或在角色頁面中拖曳進行調整。
  BoostMain: >-
    <0>提升主屬性</0> – 若遺器目前等級低於設定值，則按設定等級（或可達到的最高等級）計算主屬性。根據此設定，預覽副詞條可能計入傷害計算。因為副詞條不會進一步強化，所以目前評分較低且等級較低的遺器在實際強化後可能更強。
  KeepCurrent: <0>保留目前遺器</0> - 角色必須使用目前已裝備的遺器，然後優化器將嘗試填入空的遺器部件。
  AllowEquipped: <0>允許已裝備的遺器</0> – 啟用後，優化器將允許在搜尋中使用已被其他角色裝備的遺器。否則，已裝備的遺器將被排除在搜尋之外。
  Priority: "<0>優先級</0> - 請參閱：角色優先級過濾器。更改此設定將更改角色的優先順序。"
  Exclude: <0>排除</0> - 選擇特定角色已裝備的遺器，將其從搜尋中排除。此設定會覆蓋優先權過濾器。
  Enhance: <0>強化等級 / 稀有度</0> – 選擇搜尋時能使用的最低遺器強化等級以及遺器的最低星級。
  DPSMode: <0>DPS模式</0> – 選擇該角色在優化器屬性計算中是否作為主要增益目標（主C）或次要增益目標（副C）。
Relics:
  Title: 遺器
  p1: >-
    注意 - 潛力是一個百分比評分，它會比較該遺器與當前角色在該部件上最佳的+15遺器。此評分基於評分演算法的權重。這意味著未強化的+0遺器有時潛力會高於現有的+15遺器，因為它們的副詞條可能會升級到角色所需的屬性。
  p2: "所選角色：評分 – 該遺器目前副詞條品質占該部位理想遺器的百分比"
  p3: "選定角色：平均潛力 - 滿強化遺器的潛力權重如果副詞條升級到遺器某個副詞條屬性的平均權重，直至+15。"
  p4: "選定角色：最大潛力 - 遺器的最大潛力權重如果所有未來的副詞條都升級到角色所需的屬性。"
  p5: '所有角色：最大潛力 - 遺器在遊戲中所有角色中可能達到的最高潛力值。'
OptimizationDetails:
  Title: 優化詳情
  p1: 顯示在套用所有篩選條件後用於優化搜尋的遺器數量
  p2: 排列 - 需要搜尋的排列數量。縮小篩選條件範圍以減少排列數量和搜尋時間
  p3: 已搜尋 - 已搜尋的排列數量
  p4: 結果 - 顯示滿足屬性篩選條件的結果數量
EnemyOptions:
  Title: 敵人選項
  p1: 等級 - 敵人等級，影響敵人防禦計算
  p2: 效果抵抗 - 敵人的效果抵抗。用於持續傷害的計算。
  p3: 傷害抗性 - 敵人的元素抗性。當敵人元素弱點被啟用時，抗性設為0。
  p4: 最大韌性 - 敵人的最大韌性條值。影響與擊破傷害相關的計算。
  p5: 目標 - 戰鬥中的目標數。假定目標敵人始終處於中心位置，且傷害計算僅針對單一主要目標。
  p6: 元素弱點 - 查看敵人是否被角色的元素類型克制。啟用此選項將敵人的元素抗性百分比設為0。
  p7: 弱點擊破 - 敵人的韌性條是否被擊破。影響傷害計算和某些角色被動效果。
SubstatWeightFilter:
  Title: 副詞條權重篩選器
  p1: 此篩選器用於減少優化器需要處理的排列數量。
  p2: 它的工作原理是先根據定義的權重為每個遺器部件打分，然後按遺器的加權最小副詞條升級次數進行篩選。
  p3: 僅使用加權副詞條升級次數超過指定數量的遺器進行優化搜尋。
  p4: >-
    請注意，設定過高的最小副詞條升級次數可能導致某些配裝未被顯示，因為篩選器有可能最終排除了某個關鍵遺器。請謹慎使用此篩選器，但在大規模搜尋中，它對減少搜尋時間有很大影響。
StatDisplay:
  Title: 屬性與篩選視圖
  p1: 這允許在查看結果時切換為基礎屬性與戰鬥屬性。屬性篩選也將套用於所選視圖。
  p2: 基礎屬性 - 在遊戲中角色介面上顯示的屬性，不包含戰鬥中的增益。
  p3: "戰鬥屬性 - 角色在戰鬥中所有屬性修正後的統計，包括：技能增益、角色和光錐被動、隊友、套裝條件觸發效果等。"
ValueColumns:
  Title: 數值列
  p1: 你可以選擇性地顯示一些列，以評估某個遺器的相對「價值」。
  p2: 潛力
  p3: 潛力是針對特定角色的百分比，表示該遺器可能的優秀程度（或在滿強化後的優秀程度），與該部件上滿強化的「完美」遺器屬性進行比較。
  p4: 潛力可以查看所有角色或僅限於你持有的角色。然後，它會取所有角色中的最高百分比。
  p5: 潛力有助於尋找在任何角色上都不優秀的遺器，或是那些強化後可能非常出色的隱藏寶物。
  p6: '注意：按潛力排序可能與權重不匹配，因為權重計算更偏向於較低副詞條權重的理想遺器主屬性。'
RelicInsights:
  Title: 遺器洞察
  p1: 當在上面的表格中選擇一個遺器時，你可以選擇一個分析方法以查看其圖表。
  p2: >-
    「分類」會查看該遺器在每個角色中可能達到的完美程度（即最佳副詞條升級），並將其分為不同的百分比。<1/>如果你將滑鼠游標停在角色頭像上，你將看到達到此遺器最大潛力所需的新副詞條和/或副詞條升級。<3/>⚠️ 缺少副詞條的遺器可能會顯示出誤導性地高的分類，因為最佳升級分析會假設每個角色的最佳新副詞條添加與該遺器上。
  p3: "前十顯示該遺器最適合的前十個角色，並顯示強化此遺器可能達到的「完美」範圍。"
  p4: 使用「最大值 / 平均值」切換按鈕，在最佳強化結果與遺器滿級時的預期平均潛力之間切換。
RelicLocation:
  Title: 遺器位置
  p1: 當在網格中選擇一個遺器時，其在遊戲內背包中的位置將在此顯示。
  p2: 如果套裝/部件過濾器處於啟用狀態，請在遊戲中套用相同的過濾器，然後按獲得順序（最新的優先）排序以找到遺器。
  p3: '⚠️ 使用說明 ⚠️'
  p4: 這僅支援使用「Reliquary Archiver」匯入的遺器
  p5: 如果自上次匯入以來有新的遺器被刪除或獲得，則必須重新掃描並匯入。
  p6: 選擇適當的物品欄寬度設定以取得準確的位置。寬度取決於遊戲內螢幕和選單的寬度。
LocatorParams:
  Title: 遺器定位選項
  p1: <0>物品欄寬度</0> - 選擇遊戲內物品欄的列數，以便遺器定位器能準確找到你的遺器。
  p2: <0>自動篩選行</0> - 在遺器定位器套用部件/套裝篩選器之前的最大行數，以嘗試將搜尋的遺器靠近你背包的頂部。
