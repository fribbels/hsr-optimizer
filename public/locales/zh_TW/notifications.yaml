GPU:
  Message: 此浏览器不支持WebGPU！
  Description:
    l1: "请使用以下支持的环境之一以启用GPU加速："
    l2: "Windows 和 Mac — Chrome，Opera，Edge"
    l3: >-
      Linux — <CustomLink text="Behind a flag"/>
    l4: "如果你使用的是受支援的瀏覽器但仍然無法執行，請先嘗試更新瀏覽器版本，否則請嘗試更換瀏覽器，或將瀏覽器切換為使用獨立顯示卡而非整合顯示卡。"
GPUCrash:
  Message: WebGPU 錯誤
  Description:
    l1: GPU 加速程序已崩潰，結果可能無效。請重試或在 Discord 伺服器上回報問題。
    l2: 如需查看疑難排解步驟，請造訪<CustomLink text="documentation page."/>
