  Conditionals:
    DefaultMessage: 預設啟用 - 效果將套用於戰鬥計算。
    Hunter: 啟用後，暴擊傷害增益將套用於戰鬥屬性計算。
    Streetwise: 所選的攻擊力%增益將根據疊加層數套用於戰鬥屬性計算。
    Firesmith: 技能傷害增益預設始終處於激活狀態。啟用後，火屬性傷害增益將套用於戰鬥屬性計算。
    Genius: 10%防禦穿透增益預設始終處於激活狀態。啟用後，將敵人視為具有量子弱點，並穿透額外10%的防禦。
    Thunder: 啟用後，攻擊力%增益將套用於戰鬥屬性計算。
    Wastelander: 將所選增益套用於戰鬥屬性計算。
    Longevous: 所選的暴擊率增益將根據疊加層數套用於戰鬥屬性計算。
    Messenger: 啟用後，速度%增益將套用於戰鬥屬性計算。
    Ashblazing: >-
      所選的攻擊力%增益將套用於傷害計算，除了追加攻擊。追加攻擊的計算將從0%攻擊增益開始，並根據攻擊時造成的擊中次數疊加。擊中次數將根據敵人數量增加，並假設敵方目標位於中心以進行爆炸（3人）／範圍（全屏）攻擊。
    Prisoner: 所選的防禦穿透%增益將根據疊加層數套用於傷害計算。
    Diver: >-
      選擇0層選項可以禁用二件套效果。對於四件套，根據所選選項套用不同的暴擊增益於戰鬥屬性計算。
    Watchmaker: 啟用後，擊破特攻增益將套用於戰鬥屬性計算。
    Valorous: 啟用後，終結技傷害的增傷%增益將套用於戰鬥屬性計算。
    Sacerdos: 所選的增益將套用於傷害計算。能夠自我增益的角色可以觸發此效果。
    Scholar: 啟用後，戰技傷害的增傷%增益將根據角色的連招順序增強。
    Hero: 啟用後，速度%和暴擊傷害增益將套用於戰鬥屬性計算。
    WarriorGoddess: 啟用後，4件套的速度與暴擊傷害加成將計入戰鬥屬性計算。
    Wavestrider: 啟用後，攻擊力加成將計入戰鬥屬性計算。
    Deliverer: 啟用後，生命值與傷害加成將計入戰鬥屬性計算。
    Recluse: 啟用後，暴擊傷害加成將計入戰鬥屬性計算。
    MagicalGirl: 所選增益將計入戰鬥屬性計算。
    Diviner: 啟用後，歡愉度增益將計入戰鬥屬性計算。
    Differentiator: 啟用後，暴擊率增益將套用於戰鬥屬性計算。
    Penacony: 啟用後，傷害%增益將套用於佩戴者的憶靈。
    Sigonia: 假設角色已擊敗該數量的敵人，所選的暴擊傷害增益將套用於戰鬥屬性計算。
    Izumo: 啟用後，若隊伍中有相同命途的隊友，將在戰鬥屬性計算中套用12%暴擊率增益。
    Duran: 所選的增益將根據疊加層數套用於傷害計算。
    Kalpagni: 啟用後，將擊破特攻增益套用於戰鬥屬性計算。
    Lushaka: 預設禁用 - 該套裝無法影響佩戴者。
    Banana: 啟用後，額外的32%暴擊傷害將套用於戰鬥屬性計算。
    Arcadia: 所選增益將套用於戰鬥屬性計算。隊伍選擇變化時會自動更新。
    Amphoreus: 啟用後，若佩戴者擁有憶靈，速度加成將計入戰鬥屬性計算。
    Tengoku: 啟用後，額外暴擊傷害加成將計入戰鬥屬性計算。
    CityOfConvergingStars: 將所選增益計入戰鬥屬性計算。攻擊力加成來自施放追加攻擊，暴擊傷害加成來自擊敗敵人。
